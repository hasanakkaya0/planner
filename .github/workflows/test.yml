name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      # the build stamps the cache version; it must already be committed, otherwise sw.js is stale
      - run: node build.js
      - name: Fail if the committed version stamp is out of date
        run: git diff --exit-code -- index.html sw.js
